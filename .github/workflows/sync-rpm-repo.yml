name: Sync RPMs to DNF Repo

on:
  release:
    types: [published]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download RPM artifacts
        run: |
          mkdir -p rpms
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq .id)
          ASSETS=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets --jq '.[].name')
          for asset in $ASSETS; do
            if echo "$asset" | grep -q '\.rpm$'; then
              echo "Downloading $asset..."
              gh release download "${{ github.ref_name }}" --pattern "$asset" -D rpms
            fi
          done
          ls -la rpms/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clone RPM repo
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ploglabs/rpm-repo.git rpm-repo

      - name: Publish RPMs
        run: |
          cd rpm-repo
          for rpm in ../rpms/*.rpm; do
            filename=$(basename "$rpm")
            echo "  -> $filename"
            if echo "$filename" | grep -q "arm64\|aarch64"; then
              dest="el/9/aarch64"
            else
              dest="el/9/x86_64"
            fi
            mkdir -p "$dest"
            cp "$rpm" "$dest/"
            git add "$dest/$filename"
          done
          if git diff --cached --quiet; then
            echo "No new RPMs"
            exit 0
          fi
          git config user.email "hello@ploglabs.dev"
          git config user.name "ploglabs"
          git commit -m "publish molly-discord-relay ${{ github.ref_name }}"
          git push origin main
